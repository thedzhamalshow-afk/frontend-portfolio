<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🌤️ Weather Dashboard</h1>
            <div class="search-section">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Enter city name..." 
                    class="search-input"
                >
                <button id="searchBtn" class="search-btn">Search</button>
            </div>
        </header>
        <main class="main-content">
            <section class="current-weather" id="currentWeather">
                <div class="weather-loader">
                    <p>Loading weather data...</p>
                </div>
            </section>
            <section class="forecast-section">
                <h2>5-Day Forecast</h2>
                <div class="forecast-container" id="forecastContainer">
                    <div class="weather-loader">
                        <p>Loading forecast...</p>
                    </div>
                </div>
            </section>
            <section class="favorites-section">
                <h2>Favorite Cities</h2>
                <div class="favorites-container" id="favoritesContainer">
                    <p class="no-favorites">No favorite cities yet. Click the ❤️ to add!</p>
                </div>
            </section>
        </main>
        <footer class="footer">
            <p>Weather data provided by <a href="https://openweathermap.org/" target="_blank">OpenWeatherMap</a></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
